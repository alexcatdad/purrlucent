name: Accessibility barrier
description: Something cannot be used, or is hard to use, with a keyboard, screen reader, magnifier or other assistive technology.
labels: [accessibility]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: pl-dialog
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: purrlucent version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: technology
    attributes:
      label: Assistive technology and browser
      description: Name and version of each.
      placeholder: VoiceOver on macOS 26 with Safari 26
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: The barrier
      description: What you tried to do, what you heard or saw, and what stopped you.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the assistive technology should have announced or let you do.
    validations:
      required: true
  - type: input
    id: criterion
    attributes:
      label: WCAG success criterion or ARIA pattern
      description: Optional, if you know which one applies.
      placeholder: 2.1.1 Keyboard
