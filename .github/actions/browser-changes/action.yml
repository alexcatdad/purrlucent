name: Browser changes
description: Whether the browser jobs must run for this change. Needs a checkout with full history; see scripts/ci-changes.ts.

inputs:
  bun-version:
    description: The Bun version to run the script with.
    required: true

outputs:
  code:
    description: "`false` when every changed file is inert, otherwise `true`."
    value: ${{ steps.diff.outputs.code }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    # A pull request is checked out as its merge commit, whose first parent is
    # the base. The version pull request is dispatched on its branch. A
    # scheduled run always runs everything.
    - id: diff
      shell: bash
      run: |
        case "$GITHUB_EVENT_NAME" in
          pull_request) bun scripts/ci-changes.ts HEAD^1 HEAD >> "$GITHUB_OUTPUT" ;;
          workflow_dispatch) bun scripts/ci-changes.ts origin/main...HEAD >> "$GITHUB_OUTPUT" ;;
          *) echo code=true >> "$GITHUB_OUTPUT" ;;
        esac
