name: Setup
description: Installs Bun and the locked dependencies, reusing Bun's package cache. Runs after actions/checkout.

inputs:
  bun-version:
    description: The Bun version to install.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    # The downloaded packages, keyed on the lockfile; the install still links
    # node_modules from them, so a stale cache only costs a download.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - run: bun install --frozen-lockfile
      shell: bash
