name: Setup
description: Installs Bun and the locked dependencies. Runs after actions/checkout.

inputs:
  bun-version:
    description: The Bun version to install.
    required: true
  from-npm:
    description: Install Bun from its npm package instead of setup-bun, which needs `unzip`. For the Playwright container, which has npm but no `unzip`.
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.from-npm != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: inputs.from-npm == 'true'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        npm install --global --prefix "$RUNNER_TEMP/bun" "bun@$BUN_VERSION"
        echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"
    - run: bun install --frozen-lockfile
      shell: bash
