name: Screen readers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: screen-readers-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.5
  GUIDEPUP_SETUP_VERSION: 0.29.3
  LEFTHOOK: 0

jobs:
  voiceover:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} setup --ci --macos-record
      - run: bun install --frozen-lockfile
      - run: bunx playwright install webkit
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} install
      - run: bun run build-storybook
      - run: bunx playwright test --config e2e/screen-reader/playwright.config.ts --project webkit
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-readers-voiceover
          path: |
            e2e/screen-reader/test-results/
            recordings/
          if-no-files-found: ignore

  nvda:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} setup --ci
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} install
      - run: bun run build-storybook
      - run: bunx playwright test --config e2e/screen-reader/playwright.config.ts --project chromium
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-readers-nvda
          path: e2e/screen-reader/test-results/
          if-no-files-found: ignore

  # Single stable check name required by .github/rulesets/main.json.
  screen-readers:
    needs: [voiceover, nvda]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.voiceover.result }}" = success && test "${{ needs.nvda.result }}" = success
