name: Screen readers

# Runs on main after each merge too: see ci.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  # Manual runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-readers-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.5
  GUIDEPUP_SETUP_VERSION: 0.29.3
  LEFTHOOK: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/browser-changes
        with:
          bun-version: ${{ env.BUN_VERSION }}

  voiceover:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15
    # The limits are on the steps: setting up the screen reader and the browser
    # varies a lot in time, and the job limit only stops a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} setup --ci --macos-record
      - run: bunx playwright install webkit
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} install
      - run: bun run build-storybook
        timeout-minutes: 10
      - run: bunx playwright test --config e2e/screen-reader/playwright.config.ts --project webkit
        timeout-minutes: 20
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-readers-voiceover
          path: |
            e2e/screen-reader/test-results/
            recordings/
          if-no-files-found: ignore

  nvda:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-2025
    # The limits are on the steps, as for voiceover.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} setup --ci
      - run: bunx playwright install chromium
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@${{ env.GUIDEPUP_SETUP_VERSION }} install
      - run: bun run build-storybook
        timeout-minutes: 10
      - run: bunx playwright test --config e2e/screen-reader/playwright.config.ts --project chromium
        timeout-minutes: 20
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-readers-nvda
          path: e2e/screen-reader/test-results/
          if-no-files-found: ignore

  # Single stable check name required by .github/rulesets/main.json: both
  # screen readers passed, or the change is known to be inert and both were skipped.
  screen-readers:
    needs: [changes, voiceover, nvda]
    if: always()
    runs-on: ubuntu-latest
    env:
      VOICEOVER: ${{ needs.voiceover.result }}
      NVDA: ${{ needs.nvda.result }}
      INERT: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' }}
    steps:
      - run: |
          if [ "$INERT" = true ]; then
            test "$VOICEOVER" = skipped && test "$NVDA" = skipped
          else
            test "$VOICEOVER" = success && test "$NVDA" = success
          fi
