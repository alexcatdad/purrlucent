name: CI

# Pull requests merge without first updating from main, so a run on main after
# each merge checks the combination. A weekly run catches runner-image drift.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  # Manual runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.5
  LEFTHOOK: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run lint
      - run: bun run fmt:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run typecheck

  hig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Rules owned by the component tasks still have no test, so pending is allowed until they land.
      - run: bun run hig:check -- --allow-pending

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build
      # The packed package: exports, type paths and fields npm and bundlers read.
      - run: bun run lint:package

  # The browser-test image (.github/e2e-image): browsers, their system packages
  # and fonts preinstalled, so the browser jobs pull it instead of installing.
  # Tagged with a hash of its Dockerfile and built only when that tag is
  # missing, natively on each architecture the tests use. It is public, so
  # pulling needs no login. Job containers cannot read `env`, so the name is
  # written out where it is used.
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: tag
        env:
          HASH: ${{ hashFiles('.github/e2e-image/Dockerfile') }}
        run: echo "tag=${HASH:0:16}" >> "$GITHUB_OUTPUT"
      - env:
          REF: ghcr.io/alexcatdad/purrlucent-e2e:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "$REF exists"
            exit 0
          fi
          docker build --tag "$REF" .github/e2e-image
          docker push "$REF"

  unit:
    needs: image
    # Fails, rather than skips, when the image is missing: unit is required.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alexcatdad/purrlucent-e2e:${{ needs.image.outputs.tag }}-amd64
      options: --user 1001 --ipc=host
    # The test steps carry the limits; the job limit only stops a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # No bun-version: the image has Bun.
      - uses: ./.github/actions/setup
      # Before bun test: the package check renders the packed build in Chromium.
      - run: bun test
        timeout-minutes: 5
      - run: bun run test:unit
        timeout-minutes: 15

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/browser-changes
        with:
          bun-version: ${{ env.BUN_VERSION }}

  e2e-browser:
    name: e2e (${{ matrix.browser }} ${{ matrix.part }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: [changes, image]
    # Runs unless the change is known to be inert, so a failed `changes` job runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.image.result == 'success' }}
    # Firefox ran 11-25% faster on arm in two trials; Chromium and WebKit ran
    # 5-9% slower there in one, so they stay on x64.
    runs-on: ${{ matrix.browser == 'firefox' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/alexcatdad/purrlucent-e2e:${{ needs.image.outputs.tag }}-${{ matrix.browser == 'firefox' && 'arm64' || 'amd64' }}
      options: --user 1001 --ipc=host
    # The limits are on the steps, as for unit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Sized from measured times so every job takes about three minutes of
      # tests, and kept at 16 jobs: with unit, the screen readers and CodeQL
      # that fills the 20 jobs GitHub runs at once. The generated checks over
      # every story (tag @quality) get their own jobs, because Playwright
      # splits shards by test count and those tests are far cheaper.
      matrix:
        include:
          - { browser: chromium, part: behavior, shard: 1, of: 3 }
          - { browser: chromium, part: behavior, shard: 2, of: 3 }
          - { browser: chromium, part: behavior, shard: 3, of: 3 }
          - { browser: chromium, part: quality, shard: 1, of: 1 }
          - { browser: webkit, part: behavior, shard: 1, of: 5 }
          - { browser: webkit, part: behavior, shard: 2, of: 5 }
          - { browser: webkit, part: behavior, shard: 3, of: 5 }
          - { browser: webkit, part: behavior, shard: 4, of: 5 }
          - { browser: webkit, part: behavior, shard: 5, of: 5 }
          - { browser: webkit, part: quality, shard: 1, of: 2 }
          - { browser: webkit, part: quality, shard: 2, of: 2 }
          - { browser: firefox, part: behavior, shard: 1, of: 4 }
          - { browser: firefox, part: behavior, shard: 2, of: 4 }
          - { browser: firefox, part: behavior, shard: 3, of: 4 }
          - { browser: firefox, part: behavior, shard: 4, of: 4 }
          - { browser: firefox, part: quality, shard: 1, of: 1 }
    env:
      # The quality jobs select their file, which keeps the config's per-project
      # filters; the behavior jobs leave out the tests tagged @quality.
      TESTS: ${{ matrix.part == 'quality' && 'src/quality.e2e.ts' || '--grep-invert=@quality' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # No bun-version: the image has Bun.
      - uses: ./.github/actions/setup
      - run: bun run build-storybook
        timeout-minutes: 10
      - run: bun run test:e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.of }} "$TESTS"
        timeout-minutes: 20
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.part }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

  # One HTML report and one time summary for every shard of the run.
  e2e-report:
    needs: e2e-browser
    if: ${{ !cancelled() && needs.e2e-browser.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: bunx playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
      - run: bun scripts/e2e-timing.ts e2e-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The required check: every browser passed, or the change is known to be
  # inert and the browser jobs were skipped.
  e2e:
    needs: [changes, e2e-browser]
    if: always()
    runs-on: ubuntu-latest
    env:
      BROWSERS: ${{ needs.e2e-browser.result }}
      INERT: ${{ needs.changes.result == 'success' && needs.changes.outputs.code == 'false' }}
    steps:
      - run: |
          if [ "$INERT" = true ]; then
            test "$BROWSERS" = skipped
          else
            test "$BROWSERS" = success
          fi

  audit:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: 2.7.1
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun audit --audit-level=low
      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner
      - run: ./osv-scanner scan source --lockfile=bun.lock

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --verbose
