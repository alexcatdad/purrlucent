name: Rubric

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rubric-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.5
  LEFTHOOK: 0

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      # Forks and Dependabot PRs get no secrets, so the key is absent there.
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    outputs:
      has_key: ${{ env.HAS_KEY }}
      has_rules: ${{ steps.prepare.outputs.has_rules }}
      body: ${{ steps.verdict.outputs.body }}
      failed: ${{ steps.verdict.outputs.failed }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::OPENAI_API_KEY is not available to this run, so the rubric review is skipped."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_KEY == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: prepare
        if: env.HAS_KEY == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/rubric-prompt.ts prepare "$BASE_SHA" "$HEAD_SHA" .rubric
      # Codex gets no token and no write access.
      - id: codex
        if: env.HAS_KEY == 'true' && steps.prepare.outputs.has_rules == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.171.0
          model: gpt-6.1-terra
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .rubric/prompt.md
          output-schema-file: .rubric/schema.json
      - id: verdict
        if: env.HAS_KEY == 'true' && steps.prepare.outputs.has_rules == 'true'
        env:
          RULE_IDS: ${{ steps.prepare.outputs.rule_ids }}
          FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
        run: bun scripts/rubric-prompt.ts verdict

  # Single stable check name for .github/rulesets/main.json.
  rubric:
    needs: review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          HAS_KEY: ${{ needs.review.outputs.has_key }}
          HAS_RULES: ${{ needs.review.outputs.has_rules }}
          BODY: ${{ needs.review.outputs.body }}
          FAILED: ${{ needs.review.outputs.failed }}
        with:
          script: |
            if (process.env.REVIEW_RESULT !== "success")
              return core.setFailed("The rubric review did not complete.");
            if (process.env.HAS_KEY !== "true")
              return core.notice("OPENAI_API_KEY is not available to this run, so the rubric review was skipped.");
            if (process.env.HAS_RULES !== "true")
              return core.info("No rubric rules apply to this change.");
            const body = JSON.parse(process.env.BODY);
            const marker = "<!-- purrlucent-rubric -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.user.login === "github-actions[bot]" && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            if (process.env.FAILED !== "0") core.setFailed(`${process.env.FAILED} rubric rules failed.`);
