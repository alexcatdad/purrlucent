name: Update Linux screenshot baselines

# Manual run. Regenerates the *-linux.png screenshot baselines in the same
# Playwright container the e2e jobs use and uploads them as an artifact.
# Download the artifact and extract it at the repository root, then commit the files.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5
  LEFTHOOK: 0

jobs:
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  update:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          from-npm: true
      - run: bun run build-storybook
      # Screenshot tests only: a failing behavior test must not block new baselines.
      - run: bun run test:e2e --grep screenshot --update-snapshots=all
      - name: Archive baselines
        run: find src -name '*-linux.png' -print0 | xargs -0 tar -czf linux-baselines.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-baselines
          path: linux-baselines.tgz
          if-no-files-found: error
