name: Release

# Each version goes to a GitHub Release, with the packed tarball attached, and
# to the npm registry. npm publishing uses trusted publishing: npm accepts this
# workflow's OIDC token, so no registry token exists, and every version gets a
# provenance statement. The trusted publisher on npmjs.com names this file.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  BUN_VERSION: 1.4.5
  LEFTHOOK: 0

jobs:
  # Decides what this push should do, each independently: open or update the
  # version pull request (pending changesets), release the version on main
  # when it has a changelog and no release yet, and publish it to npm when the
  # registry does not have it yet. A changeset that lands just before the
  # version pull request merges no longer holds the release back.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      changes: ${{ steps.plan.outputs.changes }}
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # finds the commit that set the version
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version package.json)
          # The release is built from the commit that set this version, so it
          # holds what its changelog lists and nothing merged after it.
          commit=$(git log -1 --format=%H -G'^  "version":' -- package.json)
          changes=false
          for f in .changeset/*.md; do
            [ -e "$f" ] && [ "$(basename "$f")" != README.md ] && changes=true
          done
          release=false
          if [ -f CHANGELOG.md ] && ! gh release view "v${version}" > /dev/null 2>&1; then
            release=true
          fi
          # Checked apart from the GitHub Release, so a failed publish is
          # retried by the next run. npm view prints nothing, or fails, when
          # the registry lacks the version.
          publish=false
          if [ -f CHANGELOG.md ] && [ -z "$(npm view "purrlucent@${version}" version 2> /dev/null)" ]; then
            publish=true
          fi
          {
            echo "version=${version}"
            echo "commit=${commit}"
            echo "changes=${changes}"
            echo "release=${release}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

  version:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # The workflow token only reads. The version commit and pull request use a
    # token from the repository's release GitHub App: runs a pull request gets
    # from the workflow token wait for a maintainer's approval, runs from an App
    # token start on their own, so the required checks run unattended.
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # commit the version changes
          permission-pull-requests: write # open or update the version pull request
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Commits go through the GitHub API, so GitHub signs them for the App.
      - id: changesets
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: bun run version-packages
      # The version pull request merges itself once its required checks pass.
      # The App enables it, so the merge is the App's push and starts this
      # workflow again, which then creates the release.
      - name: Merge the version pull request when its checks pass
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr merge "$PR" --auto --squash

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build
      - run: bun pm pack --ignore-scripts --destination "$RUNNER_TEMP"
      - name: Write release notes from the changelog
        run: awk -v heading="## ${VERSION}" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" "${RUNNER_TEMP}/purrlucent-${VERSION}.tgz" --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" --target "${COMMIT}"

  npm:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and the provenance statement
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
      # Node 24's npm is 11.5.1 or later, which trusted publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build
      # The same packed file the GitHub Release attaches.
      - run: bun pm pack --ignore-scripts --destination "$RUNNER_TEMP"
      - run: npm publish "${RUNNER_TEMP}/purrlucent-${VERSION}.tgz"
