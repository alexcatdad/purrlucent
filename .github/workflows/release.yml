name: Release

# Releases go to GitHub Releases only. Nothing is published to the npm registry
# or GitHub Packages: no step here runs `changeset publish` or `npm publish`,
# and no registry token is configured.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  BUN_VERSION: 1.4.5
  LEFTHOOK: 0

jobs:
  # Decides what this push should do: open or update the version pull request
  # (pending changesets), or release the version already on main (no changesets
  # left, a changelog exists, and no release for that version exists yet).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      changes: ${{ steps.plan.outputs.changes }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version package.json)
          changes=false
          for f in .changeset/*.md; do
            [ -e "$f" ] && [ "$(basename "$f")" != README.md ] && changes=true
          done
          release=false
          if [ "$changes" = false ] && [ -f CHANGELOG.md ] && ! gh release view "v${version}" > /dev/null 2>&1; then
            release=true
          fi
          {
            echo "version=${version}"
            echo "changes=${changes}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

  version:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version changes
      pull-requests: write # open or update the version pull request
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun pm pack --ignore-scripts --destination "$RUNNER_TEMP"
      - name: Write release notes from the changelog
        run: awk -v heading="## ${VERSION}" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" "${RUNNER_TEMP}/purrlucent-${VERSION}.tgz" --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" --target "${GITHUB_SHA}"
