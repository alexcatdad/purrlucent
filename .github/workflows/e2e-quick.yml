name: e2e quick

# Manual run while working on a component: the e2e tests matching one path,
# in Chromium only. Its check name differs from the required `e2e` check, so a
# quick run never stands in for the full one.
#   gh workflow run e2e-quick.yml --ref <branch> -f path=src/components/checkbox
on:
  workflow_dispatch:
    inputs:
      path:
        description: Test file or folder, for example src/components/checkbox
        required: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.5
  LEFTHOOK: 0

jobs:
  quick:
    name: e2e quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run build-storybook
      - run: bun run test:e2e --project=chromium "$TEST_PATH"
        env:
          TEST_PATH: ${{ inputs.path }}
