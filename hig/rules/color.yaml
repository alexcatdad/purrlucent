- id: color/1
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: One color keeps one meaning; a hue that signals interactivity or status is not reused for decoration.
  check: rubric
  layer: tokens
- id: color/2
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Every color has light, dark, and increased-contrast values, and each pairing stays legible.
  check: automated
  test: src/tokens/tokens.e2e.ts > every text role meets 4.5:1 against background in all four color schemes
  layer: tokens
- id: color/3
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Color is never the only carrier of meaning; interactivity and state have a second cue.
  check: rubric
  layer: components
- id: color/4
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Component CSS uses semantic tokens in place of hard-coded hex, color-function, and black or white values.
  check: automated
  test: scripts/hig-check.coverage.test.ts > component CSS has no hard-coded color literals
  layer: components
- id: color/5
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Semantic tokens keep their purpose; a separator color is not used as a fill, a label color not as a background.
  check: rubric
  layer: tokens
- id: color/6
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Color on translucent surfaces, and on text or symbols over them, is used sparingly and only for emphasis.
  check: rubric
  layer: surfaces
- id: color/7
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Control labels avoid hues close to colorful content that scrolls beneath them.
  check: rubric
  layer: components
- id: color/8
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: Wide-gamut colors have an sRGB fallback that stays distinguishable.
  check: automated
  pending: Contrast tests exercise resolved tokens but do not verify an sRGB fallback for the relative OKLCH values.
  layer: tokens
- id: color/9
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: A badge's text meets 4.5:1 against its fill in every variant, and its text states the status so color is not the only cue.
  check: automated
  test: src/components/badge/badge.e2e.ts > the text meets 4.5:1 against the fill in every variant
  layer: components
- id: color/10
  source: https://developer.apple.com/design/human-interface-guidelines/color
  rule: A separator is drawn only in the border color token, as a hairline, and never as a fill.
  check: automated
  test: src/components/separator/separator.e2e.ts > the line uses the border token
  layer: components
