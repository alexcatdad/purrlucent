- id: keyboards/1
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Every control can be reached and operated with the keyboard alone, with a visible focus indicator.
  check: automated
  test: src/behaviors/pressable.test.ts > Enter fires pl-press once
  layer: behaviors
- id: keyboards/2
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Standard shortcuts keep their usual meaning; none is repurposed for a custom action.
  check: rubric
  layer: behaviors
- id: keyboards/3
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Custom shortcuts exist only for the most frequent commands.
  check: rubric
  layer: behaviors
- id: keyboards/4
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Modifier keys keep their familiar meanings, such as a modifier while dragging.
  check: rubric
  layer: behaviors
- id: keyboards/5
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Shortcut modifiers are listed in the order Control, Option, Shift, Command.
  check: rubric
  layer: behaviors
- id: keyboards/6
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: A shortcut never adds Shift to a key whose shifted character already needs Shift.
  check: rubric
  layer: behaviors
- id: keyboards/7
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Each shortcut belongs to one command family; a modifier variant of a shortcut always does a related action.
  check: rubric
  layer: behaviors
- id: keyboards/8
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: Composite controls follow the matching keyboard pattern from the ARIA Authoring Practices.
  check: automated
  test: src/behaviors/roving-focus.test.ts > arrow keys move focus in the orientation
  layer: behaviors
- id: keyboards/9
  source: https://developer.apple.com/design/human-interface-guidelines/keyboards
  rule: A shortcut shown in the interface lists its modifiers in the order Control, Option, Shift, Command, with the key last.
  check: automated
  test: src/components/kbd/kbd.e2e.ts > a shortcut keeps modifiers in the order Control, Option, Shift, Command
  layer: components
