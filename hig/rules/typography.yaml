- id: typography/1
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Body text is at least 13 CSS pixels on desktop and 17 on touch devices, and nothing is below 10 or 11.
  check: automated
  pending: The body token is 16 CSS pixels at the default root size on both fine and coarse pointers.
  layer: tokens
- id: typography/2
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Library CSS uses regular or heavier weight for explicit font-weight values.
  check: automated
  test: scripts/hig-check.coverage.test.ts > library CSS has no explicit font weights below regular
  layer: tokens
- id: typography/3
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Hierarchy comes from size, weight and color, and it holds when text is enlarged.
  check: rubric
  layer: tokens
- id: typography/4
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: The type tokens provide system fallbacks, and the library bundles no font files or font faces.
  check: automated
  test: scripts/hig-check.coverage.test.ts > type tokens use system fallbacks and the library ships no font assets
  layer: tokens
- id: typography/5
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: A named set of text styles carries size, weight and line height, and components use those styles.
  check: automated
  pending: Size and line-height tokens exist, but component weights are often authored in the component itself.
  layer: tokens
- id: typography/6
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Layouts adapt to every text size, with little truncation and no overlapping.
  check: automated
  pending: Existing zoom tests check horizontal overflow without measuring text overlap or truncation.
  layer: components
- id: typography/7
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Icons that carry meaning grow along with text size.
  check: rubric
  layer: components
- id: typography/8
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: The most important content keeps its place and priority at large text sizes.
  check: rubric
  layer: components
- id: typography/9
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Running text steps down in size from heading to body, and headings carry heavier weights.
  check: automated
  test: src/typography/typography.e2e.ts > headings step down in size and every heading is bold
  layer: surfaces
- id: typography/10
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Running text uses regular and heavier weights only.
  check: automated
  test: src/typography/typography.e2e.ts > no text is lighter than regular weight
  layer: surfaces
- id: typography/11
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Long passages use loose leading, scanned lists and tables use normal leading, and no line height is tighter than the text needs.
  check: automated
  test: src/typography/typography.e2e.ts > body text has at least 1.5 leading and every line height clears the font size
  layer: surfaces
- id: typography/12
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Running text and inline code stay at readable sizes.
  check: automated
  test: src/typography/typography.e2e.ts > body text is 16 CSS pixels and code is not smaller than 12
  layer: surfaces
