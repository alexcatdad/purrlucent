- id: typography/1
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Body text is at least 13 CSS pixels on desktop and 17 on touch devices, and nothing is below 10 or 11.
  check: automated
  layer: tokens
- id: typography/2
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Thin and light font weights are avoided; regular and heavier weights carry text.
  check: automated
  layer: tokens
- id: typography/3
  source: https://developer.apple.com/design/human-interface-guidelines/typography
  rule: Hierarchy comes from size, weight and color, and it holds when text is enlarged.
  check: rubric
  layer: tokens
