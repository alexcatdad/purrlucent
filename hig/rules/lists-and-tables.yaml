- id: lists-and-tables/1
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: A row leads with a short title, and secondary detail sits under it in a quieter style.
  check: rubric
  layer: components
- id: lists-and-tables/2
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: A row that navigates is one target across its full width, with a single tab stop.
  check: automated
  test: src/components/item/item.e2e.ts > a click anywhere on the row follows the link
  layer: components
- id: lists-and-tables/3
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Controls inside a row stay separate targets and do not trigger the row.
  check: automated
  test: src/components/item/item.e2e.ts > clicking the button does not follow the link
  layer: components
- id: lists-and-tables/4
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: A row is at least as tall as the minimum touch target.
  check: automated
  test: src/components/item/item.e2e.ts > the row is at least the minimum target height
  layer: components
- id: lists-and-tables/5
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Leading media comes first and trailing controls last, mirrored in right-to-left layouts.
  check: automated
  test: src/components/item/item.e2e.ts > under rtl the media sits at the right edge
  layer: components
- id: lists-and-tables/6
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Row text wraps instead of being cut off, so larger text sizes stay readable.
  check: automated
  test: src/components/item/item.e2e.ts > long text wraps without horizontal overflow at 200% text zoom
  layer: components
- id: lists-and-tables/7
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Text is presented in a list or table, whose rows are easy to scan.
  check: rubric
  layer: components
- id: lists-and-tables/8
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Selecting an item gives appropriate feedback.
  check: automated
  test: src/components/data-table/data-table.e2e.ts > a selected row is marked by its checkbox and a fill
  layer: components
- id: lists-and-tables/9
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Table text is kept readable where it may wrap or be clipped.
  check: automated
  test: src/components/data-table/data-table.e2e.ts > no horizontal overflow at 200% text zoom
  layer: components
- id: lists-and-tables/10
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: A multicolumn table has descriptive column headings, as nouns or short noun phrases in title-style capitalization with no ending punctuation.
  check: rubric
  layer: components
- id: lists-and-tables/11
  source: https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
  rule: Clicking a column heading sorts by that column, and clicking the sorted heading reverses the direction.
  check: automated
  test: src/components/data-table/data-table.e2e.ts > a click sorts ascending, a second click reverses, and pl-sort reports it
  layer: components
