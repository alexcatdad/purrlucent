  layer: components
- id: loading/2
  source: https://developer.apple.com/design/human-interface-guidelines/loading
  rule: A placeholder is replaced by the real content as it becomes available.
  check: rubric
  layer: components
- id: loading/3
  source: https://developer.apple.com/design/human-interface-guidelines/loading
  rule: People can keep using other parts of the app while content loads in the background.
  check: rubric
