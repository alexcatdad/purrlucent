pre-commit:
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --verbose
    - name: lint
      run: bun run lint
    - name: fmt
      run: bun run fmt:check

# AI rubric review with the developer's own Codex login; no API key leaves this machine.
pre-push:
  jobs:
    - name: rubric
      run: bun scripts/rubric-prompt.ts review origin/main
